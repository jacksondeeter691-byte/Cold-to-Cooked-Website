<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#0E0E0E;font-family:Inter,-apple-system,sans-serif}
.v{position:absolute;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(237,184,33,.28) 0%,rgba(237,184,33,.06) 38%,transparent 62%)}
.ring{position:absolute;width:760px;height:760px;border-radius:50%;border:10px solid #EDB821;box-shadow:0 0 80px rgba(237,184,33,.35),inset 0 0 80px rgba(237,184,33,.15)}
.e{font-family:'Noto Color Emoji';font-size:400px;line-height:1;position:relative}
.wm{position:relative;text-align:center;color:#F4F4F4;font-weight:900;letter-spacing:-.03em;line-height:.95}
.wm b{color:#EDB821;font-family:'DejaVu Serif',serif;font-style:italic;font-weight:400}
.steam{position:absolute;top:150px;left:50%;transform:translateX(-50%);display:flex;gap:40px}
.steam i{display:block;width:18px;height:120px;border-radius:20px;background:linear-gradient(#EDB82100,#EDB821)}
</style></head><body>
<div class="v" id="a"><div class="glow"></div><div class="ring"></div><div class="e">🍽️</div></div>
<div class="v" id="b" style="background:#EDB821"><div class="e" style="font-size:470px">🍽️</div></div>
<div class="v" id="c"><div class="glow"></div><div class="ring"></div>
  <div class="wm" style="font-size:135px">Cold<br><b style="font-size:110px">to</b><br>Cooked</div></div>
</body></html>
