<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cold-to-Cooked Reel</title>
<style>
  :root {
    --gold: #EDB821; --gold-light: #F5CF5A; --bg: #0E0E0E; --surface: #171717;
    --surface2: #202020; --text: #F4F4F4; --muted: #8A8A8A; --green: #34C759; --red: #FF453A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; color: var(--text);
         -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 60px 60px; }
  .glow { position: absolute; width: 1400px; height: 1400px; left: -160px; top: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(237,184,33,.16) 0%, transparent 60%); }

  /* chapter pills */
  #chapters { position: absolute; top: 220px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; }
  .pill { font: 600 22px 'JetBrains Mono', monospace; letter-spacing: .08em; padding: 8px 16px; border-radius: 100px;
    border: 2px solid rgba(255,255,255,.14); color: rgba(255,255,255,.35); white-space: nowrap; }
  .pill.on { background: var(--gold); border-color: var(--gold); color: #000; }
  #bar { position: absolute; top: 290px; left: 180px; right: 180px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.08); }
  #barfill { height: 100%; width: 0; border-radius: 6px; background: var(--gold); }

  /* headline captions */
  #headline { position: absolute; top: 340px; left: 90px; right: 90px; text-align: center;
    font-size: 78px; font-weight: 700; line-height: 1.12; letter-spacing: -.02em; }
  #headline.big { top: 0; bottom: 380px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; font-size: 118px; }
  .w { display: inline-block; margin: 0 .12em; will-change: transform, opacity, filter; }
  .w.accent { color: var(--gold); font-family: 'DejaVu Serif', Georgia, serif; font-style: italic; font-weight: 400; }

  #visual { position: absolute; left: 0; right: 0; top: 640px; height: 900px; }
  .layer { position: absolute; inset: 0; }

  #brand { position: absolute; bottom: 120px; left: 0; right: 0; text-align: center;
    font: 500 26px 'JetBrains Mono', monospace; color: rgba(255,255,255,.28); letter-spacing: .04em; }

  /* ---------- visual parts ---------- */
  .emoji { font-family: 'Noto Color Emoji', 'Apple Color Emoji', sans-serif; line-height: 1; }
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }

  /* fridge */
  .fridge { position: absolute; left: 190px; top: 30px; width: 700px; height: 840px; border-radius: 48px;
    background: #1b1b1b; border: 4px solid #2c2c2c; box-shadow: inset 0 0 120px rgba(237,184,33,.10); overflow: hidden; }
  .fridge .light { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,240,200,.22), transparent 70%); }
  .shelf { position: absolute; left: 40px; right: 40px; height: 8px; border-radius: 8px; background: rgba(255,255,255,.12); }
  .item { position: absolute; width: 200px; text-align: center; }
  .item .emoji { font-size: 120px; }
  .item .lbl { margin-top: 10px; font: 600 28px 'Inter'; color: var(--text); background: rgba(0,0,0,.55);
    display: inline-block; padding: 6px 16px; border-radius: 100px; border: 2px solid rgba(237,184,33,.4); }
  .door { position: absolute; left: 186px; top: 26px; width: 708px; height: 848px; border-radius: 48px; background: #262626;
    border: 4px solid #333; transform-origin: left center; }
  .door .handle { position: absolute; right: 40px; top: 300px; width: 18px; height: 240px; border-radius: 10px; background: #444; }

  /* steps */
  .row { position: absolute; left: 110px; right: 110px; height: 160px; border-radius: 32px; background: var(--surface);
    border: 2px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 30px; padding: 0 36px; }
  .row .num { flex: none; width: 84px; height: 84px; border-radius: 50%; background: rgba(237,184,33,.14); color: var(--gold);
    font: 800 40px 'Inter'; display: flex; align-items: center; justify-content: center; }
  .row .t { font: 700 42px 'Inter'; }
  .row .s { font: 500 30px 'Inter'; color: var(--muted); margin-top: 4px; }
  .row .chk { margin-left: auto; flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--green);
    display: flex; align-items: center; justify-content: center; }

  /* recipe cards */
  .card { position: absolute; left: 110px; right: 110px; height: 230px; border-radius: 36px; background: var(--surface);
    border: 2px solid rgba(237,184,33,.25); display: flex; align-items: center; gap: 34px; padding: 0 40px;
    box-shadow: 0 30px 60px rgba(0,0,0,.5); }
  .card .pic { flex: none; width: 150px; height: 150px; border-radius: 28px; background: linear-gradient(135deg,#2a2412,#151515);
    display: flex; align-items: center; justify-content: center; font-size: 96px; }
  .card .n { font: 800 46px 'Inter'; letter-spacing: -.01em; }
  .card .meta { display: flex; gap: 14px; margin-top: 16px; }
  .chip { font: 600 28px 'Inter'; padding: 8px 20px; border-radius: 100px; background: rgba(237,184,33,.14); color: var(--gold-light); }

  /* phone */
  .phone { position: absolute; left: 290px; top: 0; width: 500px; height: 900px; border-radius: 76px; background: #000;
    border: 6px solid #333; overflow: hidden; box-shadow: 0 50px 100px rgba(0,0,0,.6), 0 0 0 2px rgba(237,184,33,.25); }
  .phone .notch { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 150px; height: 44px; border-radius: 30px; background: #111; z-index: 5; }
  .phone .view { position: absolute; left: 24px; right: 24px; top: 100px; height: 560px; border-radius: 40px; overflow: hidden;
    background: linear-gradient(180deg,#2a2a22,#141414); }
  .phone .view .emoji { position: absolute; font-size: 96px; }
  .phone .scan { position: absolute; left: 0; right: 0; height: 6px; background: var(--gold); box-shadow: 0 0 40px 12px rgba(237,184,33,.55); }
  .phone .corner { position: absolute; width: 60px; height: 60px; border-color: var(--gold); border-style: solid; }
  .phone .shutter { position: absolute; bottom: 70px; left: 50%; width: 130px; height: 130px; margin-left: -65px; border-radius: 50%;
    border: 8px solid #fff; display: flex; align-items: center; justify-content: center; }
  .phone .shutter i { width: 96px; height: 96px; border-radius: 50%; background: #fff; display: block; }
  .phone .ready { position: absolute; left: 24px; right: 24px; bottom: 60px; height: 150px; border-radius: 32px; background: var(--gold);
    color: #000; font: 800 40px 'Inter'; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .tag { position: absolute; font: 700 32px 'Inter'; padding: 14px 24px; border-radius: 100px; background: var(--surface2);
    border: 2px solid rgba(52,199,89,.6); white-space: nowrap; display: flex; align-items: center; gap: 12px; }
  .tag b { color: var(--green); }

  /* counter */
  .count { position: absolute; left: 0; right: 0; top: 120px; text-align: center; font: 900 520px/1 'Inter Display', 'Inter';
    color: var(--gold); letter-spacing: -.04em; }
  .countlbl { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font: 600 44px 'Inter'; color: var(--muted); }

  /* cta */
  .cbox { position: absolute; left: 90px; right: 90px; top: 120px; border-radius: 44px; background: var(--surface);
    border: 2px solid rgba(255,255,255,.1); padding: 50px; box-shadow: 0 40px 80px rgba(0,0,0,.55); }
  .cbox .who { display: flex; align-items: center; gap: 24px; }
  .av { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg,var(--gold),#c46b1a); flex: none; }
  .cbox .typed { font: 900 150px 'Inter'; letter-spacing: -.02em; min-height: 170px; }
  .caret { display: inline-block; width: 10px; height: 130px; background: var(--gold); vertical-align: -12px; margin-left: 8px; }
  .heart { position: absolute; right: 50px; top: 70px; font-size: 80px; }
  .input { margin-top: 30px; height: 100px; border-radius: 100px; border: 3px solid var(--gold); display: flex; align-items: center;
    padding: 0 36px; font: 500 34px 'Inter'; color: var(--muted); }
  .appicon { position: absolute; left: 50%; top: 640px; margin-left: -110px; width: 220px; height: 220px; border-radius: 52px;
    background: linear-gradient(145deg,#1d1d1d,#0b0b0b); border: 3px solid rgba(237,184,33,.5); display: flex; align-items: center;
    justify-content: center; font-size: 130px; box-shadow: 0 0 80px rgba(237,184,33,.3); }

  /* bigtext emoji */
  .hero-emoji { font-size: 300px; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <div class="glow" id="glow"></div>
  <div id="chapters"></div>
  <div id="bar"><div id="barfill"></div></div>
  <div id="visual"></div>
  <div id="headline"></div>
  <div id="brand">Cold-to-Cooked · AI recipes from your fridge</div>
</div>
<script>
// ---------- math helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.7, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// progress of an entrance that starts at `delay` (scene-local seconds) and lasts `len`
const P = (lt, delay, len = .45, fn = easeOut) => fn(clamp((lt - delay) / len));
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const CHECK = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

// ---------- visuals: build(data, layer) -> update(lt, dur) ----------
const VISUALS = {
  bigtext(d, L) {
    // headline is centred full-screen; optional emoji beneath
    const e = d.emoji ? el('div', 'center emoji hero-emoji', d.emoji) : null;
    if (e) { e.style.top = '78%'; L.appendChild(e); }
    return lt => { if (e) { const p = P(lt, .5, .6, back); e.style.transform = `translate(-50%,-50%) scale(${p}) rotate(${(1 - p) * -20}deg)`; e.style.opacity = p; } };
  },

  fridge(d, L) {
    const f = el('div', 'fridge'); f.appendChild(el('div', 'light'));
    [300, 600].forEach(y => { const s = el('div', 'shelf'); s.style.top = y + 'px'; f.appendChild(s); });
    const slots = [[60, 40], [250, 40], [440, 40], [60, 340], [250, 340], [440, 340], [150, 640], [350, 640]];
    const items = d.items.map((it, i) => {
      const x = el('div', 'item', `<div class="emoji">${it[0]}</div><div class="lbl">${it[1]}</div>`);
      x.style.left = slots[i][0] + 'px'; x.style.top = slots[i][1] + 'px'; f.appendChild(x); return x;
    });
    const door = el('div', 'door'); door.appendChild(el('div', 'handle'));
    L.style.perspective = '2400px'; L.appendChild(f); L.appendChild(door);
    return lt => {
      const o = P(lt, .1, .8, easeInOut);
      door.style.transform = `rotateY(${-o * 105}deg)`; door.style.opacity = 1 - clamp((o - .7) / .3);
      items.forEach((x, i) => { const p = P(lt, .7 + i * (d.stagger || .28), .5, back); x.style.transform = `scale(${p}) translateY(${(1 - p) * 40}px)`; x.style.opacity = clamp(p * 2); });
    };
  },

  steps(d, L) {
    const gap = 190, top = Math.max(0, (900 - d.items.length * gap) / 2);
    const rows = d.items.map((it, i) => {
      const r = el('div', 'row', `<div class="num">${i + 1}</div><div><div class="t">${it[0]}</div>${it[1] ? `<div class="s">${it[1]}</div>` : ''}</div><div class="chk">${CHECK}</div>`);
      r.style.top = top + i * gap + 'px'; L.appendChild(r); return r;
    });
    return lt => rows.forEach((r, i) => {
      const at = (d.start || .5) + i * (d.stagger || .9), p = P(lt, at, .45);
      r.style.opacity = p; r.style.transform = `translateX(${(1 - p) * -120}px)`;
      const c = P(lt, at + .45, .35, back), k = r.querySelector('.chk');
      k.style.transform = `scale(${c})`; r.style.borderColor = c > .5 ? 'rgba(52,199,89,.45)' : 'rgba(255,255,255,.08)';
    });
  },

  recipes(d, L) {
    const gap = 270, top = Math.max(0, (900 - d.items.length * gap) / 2);
    const cards = d.items.map((it, i) => {
      const c = el('div', 'card', `<div class="pic emoji">${it[0]}</div><div><div class="n">${it[1]}</div><div class="meta">${it.slice(2).map(m => `<span class="chip">${m}</span>`).join('')}</div></div>`);
      c.style.top = top + i * gap + 'px'; L.appendChild(c); return c;
    });
    return lt => cards.forEach((c, i) => { const p = P(lt, .4 + i * (d.stagger || .5), .55, back); c.style.opacity = clamp(p * 1.5); c.style.transform = `translateY(${(1 - p) * 200}px) scale(${.9 + .1 * p})`; });
  },

  phone(d, L) {
    const ph = el('div', 'phone'); ph.appendChild(el('div', 'notch'));
    const v = el('div', 'view'); ph.appendChild(v);
    const pos = [[40, 50], [250, 30], [140, 200], [30, 360], [270, 330], [160, 430]];
    (d.photo || []).forEach((e, i) => { const x = el('span', 'emoji', e); x.style.left = pos[i % 6][0] + 'px'; x.style.top = pos[i % 6][1] + 'px'; v.appendChild(x); });
    [['top', 'left'], ['top', 'right'], ['bottom', 'left'], ['bottom', 'right']].forEach(([a, b]) => {
      const c = el('div', 'corner'); c.style[a] = '24px'; c.style[b] = '24px';
      c.style[`border${a[0].toUpperCase() + a.slice(1)}Width`] = '8px'; c.style[`border${b[0].toUpperCase() + b.slice(1)}Width`] = '8px';
      c.style.borderRadius = { 'topleft': '24px 0 0 0', 'topright': '0 24px 0 0', 'bottomleft': '0 0 0 24px', 'bottomright': '0 0 24px 0' }[a + b];
      ['Top', 'Right', 'Bottom', 'Left'].forEach(s => { if (s.toLowerCase() !== a && s.toLowerCase() !== b) c.style[`border${s}Width`] = '0'; });
      v.appendChild(c);
    });
    const scan = el('div', 'scan'); v.appendChild(scan);
    const sh = el('div', 'shutter', '<i></i>'); ph.appendChild(sh);
    const ready = el('div', 'ready', `<span class="emoji" style="font-size:50px">👨‍🍳</span> ${d.ready || '3 recipes ready'}`); ph.appendChild(ready);
    L.appendChild(ph);
    const tpos = [[40, 120, 'l'], [800, 220, 'r'], [30, 400, 'l'], [790, 500, 'r'], [60, 680, 'l'], [780, 760, 'r']];
    const tags = (d.tags || []).map((t, i) => { const g = el('div', 'tag', `<span class="emoji">${t[0]}</span>${t[1]} <b>✓</b>`); g.style.top = tpos[i][1] + 'px';
      if (tpos[i][2] === 'l') g.style.left = tpos[i][0] + 'px'; else g.style.right = (1080 - tpos[i][0] - 250) + 'px'; L.appendChild(g); return g; });
    return lt => {
      const pin = P(lt, 0, .6, back); ph.style.transform = `translateY(${(1 - pin) * 300}px)`; ph.style.opacity = clamp(pin * 2);
      const press = lt > 1.0 && lt < 1.25 ? .9 : 1; sh.style.transform = `scale(${press})`;
      const flash = clamp(1 - Math.abs(lt - 1.15) / .2); v.style.boxShadow = `inset 0 0 0 1000px rgba(255,255,255,${flash * .7})`;
      const sp = clamp((lt - 1.3) / 1.4); scan.style.top = (easeInOut(sp) * 550) + 'px'; scan.style.opacity = sp > 0 && sp < 1 ? 1 : 0;
      sh.style.opacity = 1 - P(lt, 2.7 + tags.length * .25, .3);
      ready.style.opacity = P(lt, 2.8 + tags.length * .25, .4); ready.style.transform = `translateY(${(1 - P(lt, 2.8 + tags.length * .25, .5, back)) * 80}px)`;
      tags.forEach((g, i) => { const p = P(lt, 1.5 + i * .25, .4, back); g.style.opacity = clamp(p * 2); g.style.transform = `scale(${p})`; });
    };
  },

  counter(d, L) {
    const n = el('div', 'count'), l = el('div', 'countlbl', d.label || '');
    L.appendChild(n); L.appendChild(l);
    return lt => { const p = P(lt, .2, d.countTime || 1.2); n.textContent = (d.prefix || '') + Math.round(p * d.to) + (d.suffix || '');
      const pop = P(lt, .2 + (d.countTime || 1.2), .35, back); n.style.transform = `scale(${.85 + .15 * pop})`; n.style.opacity = clamp(P(lt, 0, .3) );
      l.style.opacity = P(lt, .6, .4); };
  },

  cta(d, L) {
    const b = el('div', 'cbox', `<div class="who"><div class="av"></div><div style="font:600 36px Inter;color:var(--muted)">you</div></div>
      <div class="typed"><span class="txt"></span><span class="caret"></span></div><div class="input">Add a comment…</div>`);
    const heart = el('div', 'heart emoji', '❤️'); b.appendChild(heart);
    const icon = el('div', 'appicon emoji', '🍽️');
    L.appendChild(b); L.appendChild(icon);
    const txt = b.querySelector('.txt'), caret = b.querySelector('.caret');
    return lt => {
      const pin = P(lt, 0, .5, back); b.style.transform = `translateY(${(1 - pin) * 200}px)`; b.style.opacity = clamp(pin * 2);
      const k = d.keyword; const n = Math.floor(clamp((lt - .6) / (k.length * .14)) * k.length); txt.textContent = k.slice(0, n);
      caret.style.opacity = Math.floor(lt * 2.5) % 2 ? 0 : 1;
      const h = P(lt, .8 + k.length * .14, .4, back); heart.style.transform = `scale(${h})`;
      const ip = P(lt, 1.4 + k.length * .14, .6, back); icon.style.transform = `scale(${ip}) rotate(${(1 - ip) * 30}deg)`; icon.style.opacity = clamp(ip * 2);
    };
  },
};

// ---------- timeline ----------
let SCENES = [], CHAPTERS = [], TOTAL = 0;
const H = document.getElementById('headline'), V = document.getElementById('visual');

function parseWords(say) {
  // "*word*" = accent (gold italic). Multi-word accent: "*two words*"
  const out = []; let accent = false;
  say.split(/\s+/).filter(Boolean).forEach(tok => {
    let a = accent || tok.startsWith('*'); if (tok.startsWith('*')) accent = true;
    const end = tok.endsWith('*') || tok.match(/\*[.,!?:;]?$/); if (end) accent = false;
    out.push({ text: tok.replace(/\*/g, ''), accent: a });
  });
  return out;
}

window.loadReel = function (cfg) {
  const wps = cfg.wordGap || .3;
  let t = 0;
  SCENES = cfg.scenes.map(s => {
    const words = parseWords(s.say || '');
    const wordsDone = (s.wordStart || .15) + words.length * (s.wordGap || wps);
    const dur = s.dur || Math.max(wordsDone + (s.hold || 1.4), s.minDur || 0);
    const layer = el('div', 'layer'); V.appendChild(layer); layer.style.opacity = 0;
    const update = VISUALS[s.visual] ? VISUALS[s.visual](s, layer) : () => {};
    const sc = { ...s, words, start: t, dur, layer, update, wps: s.wordGap || wps };
    t += dur; return sc;
  });
  TOTAL = t;
  CHAPTERS = [...new Set(SCENES.map(s => s.chapter).filter(Boolean))];
  const C = document.getElementById('chapters');
  CHAPTERS.forEach((c, i) => C.appendChild(el('div', 'pill', String(i + 1).padStart(2, '0'))));
  if (cfg.brand) document.getElementById('brand').textContent = cfg.brand;
  return TOTAL;
};

let curScene = null;
window.seek = function (t) {
  const s = SCENES.find(s => t >= s.start && t < s.start + s.dur) || SCENES[SCENES.length - 1];
  const lt = t - s.start;
  // headline words: build once per scene
  if (curScene !== s) {
    curScene = s; H.className = s.visual === 'bigtext' ? 'big' : '';
    H.innerHTML = ''; s.words.forEach(w => H.appendChild(el('span', 'w' + (w.accent ? ' accent' : ''), w.text)));
    // chapter pills: active one shows its label
    const ci = CHAPTERS.indexOf(s.chapter);
    [...document.querySelectorAll('.pill')].forEach((p, i) => { p.className = 'pill' + (i === ci ? ' on' : '');
      p.textContent = String(i + 1).padStart(2, '0') + (i === ci ? ' · ' + s.chapter.toUpperCase() : ''); });
  }
  [...H.children].forEach((w, i) => {
    const p = P(lt, (s.wordStart || .15) + i * s.wps, .28);
    w.style.opacity = .12 + .88 * p; w.style.transform = `translateY(${(1 - p) * 22}px)`; w.style.filter = `blur(${(1 - p) * 10}px)`;
  });
  // scene in/out
  SCENES.forEach(o => { if (o !== s) o.layer.style.opacity = 0; });
  const fin = P(lt, 0, .3), fout = 1 - clamp((lt - (s.dur - .25)) / .25);
  const last = s === SCENES[SCENES.length - 1];
  s.layer.style.opacity = Math.min(fin, last ? 1 : fout);
  H.style.opacity = last ? 1 : fout;
  s.update(lt, s.dur);
  document.getElementById('barfill').style.width = (clamp(t / TOTAL) * 100) + '%';
  document.getElementById('glow').style.transform = `translate(${Math.sin(t * .6) * 80}px, ${Math.cos(t * .4) * 60}px)`;
};

// Preview mode: open reel.html?script=../scripts/x.json in a browser to watch it live
const qs = new URLSearchParams(location.search).get('script');
if (qs) fetch(qs).then(r => r.json()).then(cfg => { const T = window.loadReel(cfg); const t0 = performance.now();
  (function loop() { window.seek(((performance.now() - t0) / 1000) % T); requestAnimationFrame(loop); })(); });
</script>
</body>
</html>
